#This is an example configuration file for mumudvb selecting a subset of a
#transponder with full autoconfiguration.
#
#Partial autoconfiguration (autoconfiguration=partial) was removed. To stream
#only some services, use autoconfiguration=full together with autoconf_sid_list
#(or autoconf_sid_list_ignore).
#
#All the commented lines are optional (except for tuning you have to match your system)
#To set unicast HTTP refer to README_CONF and README
#
#------------ TUNING -------------
#The DVB/ATSC card we want to use
#card=2
#The Transponder frequency
freq=12597
# ---- SATELLITE (DVB-S) -----
#The polarisation (can be h, v, l, r)
pol=V
#The symbol rate
srate=27500
# ----- CABLE (DVB-C) ----
#The symbol rate
#srate=27500
# ---- TERRESTRIAL (DVB-T) -----
#For DVB-T if the bandwidth is 8MHz you don't have to set other parameters
#
# ----- ATSC ----
#For ATSC you could have to set the modulation if it's different from VSB_8
#
#---------- AUTOCONFIGURATION -----------
#Discover channels and their PIDs, but only for the listed service IDs
autoconfiguration=full
#Replace these service IDs with the ones you want to stream
autoconf_sid_list=1027 1034
#
#--------- NETWORKING --------------
#Do we want to have the same port for all the channels ?
common_port=1234
#
#Do we need to change the default multicast TTL (if you have routers, default value : 2) ?
#multicast_ttl=10
#
#What is the IPv4 template for autoconfigured channels?
#autoconf_ip4=239.100.%card.%number
#
#--------- SAP ANNOUNCES --------------
#The sap announces are sent automatically with full autoconfiguration
#Do we want to send the announces ?
sap=1
#
#What is the default playlist group for the SAP announces (optional) ?
sap_default_group=My channels
#Who is the organisation which send the stream (optional) ?
#sap_organisation=my_organisation
#The interval between the SAP announces in second (default 5)
#sap_interval=10
# ---------- PAT REWRITING ----------
#If some of the clients are set top boxes we will probably need to rewrite the PAT pid
#rewrite_pat=1
#
# ---------- SCRAMBLED CHANNELS ----------
#Do we want hardware descrambling ?
#cam_support=1
#
#If you have multiple CAMs you can specify the number of the one which will be used
#cam_number=2
